name: Release | Asterinas Kata Bundle

on:
  push:
    branches:
      - asterinas
  workflow_dispatch:
    inputs:
      release_tag:
        description: Git tag to create or update for this Asterinas release
        required: true
        type: string
      release_name:
        description: Optional display name for the GitHub release
        required: false
        type: string
      draft_release:
        description: Create the GitHub release as a draft
        required: true
        default: true
        type: boolean
      asterinas_repository:
        description: GitHub repository that contains the Asterinas source
        required: true
        default: jjf-dev/asterinas
        type: string
      asterinas_ref:
        description: Git ref, branch, or tag to build from the Asterinas repository
        required: true
        default: kata-support
        type: string
      asterinas_builder_image:
        description: Container image used to build the Asterinas kernel
        required: true
        default: asterinas/asterinas:0.17.1-20260319
        type: string
      force_runtime_build:
        description: Rebuild kata-runtime even if src/runtime matches the upstream release tag
        required: true
        default: false
        type: boolean
      kata_static_release_repository:
        description: Repository used as the official Kata base release source
        required: true
        default: kata-containers/kata-containers
        type: string

permissions:
  contents: write

env:
  ASTERINAS_REPOSITORY: ${{ inputs.asterinas_repository || 'jjf-dev/asterinas' }}
  ASTERINAS_REF: ${{ inputs.asterinas_ref || 'kata-support' }}
  ASTERINAS_BUILDER_IMAGE: ${{ inputs.asterinas_builder_image || 'asterinas/asterinas:0.17.1-20260319' }}
  FORCE_RUNTIME_BUILD: ${{ inputs.force_runtime_build || false }}
  KATA_STATIC_RELEASE_REPOSITORY: ${{ inputs.kata_static_release_repository || 'kata-containers/kata-containers' }}

jobs:
  build-asterinas-kernel:
    name: Build Asterinas kernel artifact
    runs-on: ubuntu-22.04
    outputs:
      asterinas_commit: ${{ steps.asterinas_commit.outputs.value }}
    container:
      image: ${{ inputs.asterinas_builder_image || 'asterinas/asterinas:0.17.1-20260319' }}
    steps:
      - name: Check Out Asterinas
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ASTERINAS_REPOSITORY }}
          ref: ${{ env.ASTERINAS_REF }}
          path: asterinas

      - name: Record Asterinas Commit
        id: asterinas_commit
        shell: bash
        run: |
          set -euo pipefail
          echo "value=$(git -C asterinas rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Build qemu-direct Kernels
        shell: bash
        run: |
          set -euo pipefail

          kernel_artifact_dir="${GITHUB_WORKSPACE}/build/asterinas-kernel"
          kernel_artifact_name="aster-kernel-osdk-bin.qemu_elf"
          kernel_artifact="${kernel_artifact_dir}/${kernel_artifact_name}"
          tdx_kernel_artifact="${kernel_artifact}-tdx"

          mkdir -p "${kernel_artifact_dir}"

          make -C asterinas kernel BOOT_METHOD=qemu-direct
          install -m 0755 "asterinas/target/osdk/${kernel_artifact_name}" "${kernel_artifact}"

          make -C asterinas kernel BOOT_METHOD=qemu-direct INTEL_TDX=1
          install -m 0755 "asterinas/target/osdk/${kernel_artifact_name}" "${tdx_kernel_artifact}"

          test -f "${kernel_artifact}"
          test -f "${tdx_kernel_artifact}"

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asterinas-kernel-amd64
          path: |
            build/asterinas-kernel/aster-kernel-osdk-bin.qemu_elf
            build/asterinas-kernel/aster-kernel-osdk-bin.qemu_elf-tdx
          if-no-files-found: error
          retention-days: 7

  build-release-bundle:
    name: Build and publish Asterinas Kata bundle
    runs-on: ubuntu-22.04
    needs:
      - build-asterinas-kernel
    permissions:
      contents: write
    steps:
      - name: Check Out kata-containers
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive Go Version from versions.yaml
        id: go_version
        shell: bash
        run: |
          go_version="$(awk '
            $1 == "languages:" { in_languages=1; next }
            in_languages && $1 == "golang:" { in_golang=1; next }
            in_golang && $1 == "version:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' versions.yaml)"
          test -n "${go_version}"
          echo "value=${go_version}" >> "${GITHUB_OUTPUT}"

      - name: Set Up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go_version.outputs.value }}

      - name: Install Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio zstd

      - name: Download Asterinas Kernel Artifact
        uses: actions/download-artifact@v4
        with:
          name: asterinas-kernel-amd64
          path: build/asterinas-kernel

      - name: Build Asterinas-Flavoured Kata Tarball
        id: bundle
        env:
          ARCHITECTURE: amd64
          ASTERINAS_KERNEL: ${{ github.workspace }}/build/asterinas-kernel/aster-kernel-osdk-bin.qemu_elf
          ASTERINAS_TDX_KERNEL: ${{ github.workspace }}/build/asterinas-kernel/aster-kernel-osdk-bin.qemu_elf-tdx
          ASTERINAS_REPOSITORY: ${{ env.ASTERINAS_REPOSITORY }}
          ASTERINAS_REF: ${{ env.ASTERINAS_REF }}
          ASTERINAS_COMMIT: ${{ needs.build-asterinas-kernel.outputs.asterinas_commit }}
          ASTERINAS_BUILDER_IMAGE: ${{ env.ASTERINAS_BUILDER_IMAGE }}
          FORCE_RUNTIME_BUILD: ${{ env.FORCE_RUNTIME_BUILD }}
          KATA_STATIC_RELEASE_REPOSITORY: ${{ env.KATA_STATIC_RELEASE_REPOSITORY }}
        run: |
          chmod +x ./tools/packaging/release/build-asterinas-release.sh
          ./tools/packaging/release/build-asterinas-release.sh

      - name: Verify Packaged Release Contents
        run: |
          set -euo pipefail

          tar -I zstd -tf "${{ steps.bundle.outputs.release_asset }}" | grep -E '(^|/)opt/kata/share/kata-containers/aster-kernel-osdk-bin\.qemu_elf$'
          tar -I zstd -tf "${{ steps.bundle.outputs.release_asset }}" | grep -E '(^|/)opt/kata/share/kata-containers/aster-kernel-osdk-bin\.qemu_elf-tdx$'
          tar -I zstd -tf "${{ steps.bundle.outputs.release_asset }}" | grep -F "opt/kata/share/kata-containers/tools/kata/kata_env.sh"
          tar -I zstd -tf "${{ steps.bundle.outputs.release_asset }}" | grep -F "opt/kata/share/kata-containers/tools/kata/run_kata.sh"
          tar -I zstd -tf "${{ steps.bundle.outputs.release_asset }}" | grep -F "opt/kata/share/kata-containers/tools/kata/kata_services.sh"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asterinas-kata-release
          path: |
            ${{ steps.bundle.outputs.release_asset }}
            ${{ steps.bundle.outputs.manifest_file }}
            ${{ steps.bundle.outputs.checksums_file }}
            ${{ steps.bundle.outputs.build_summary }}
            ${{ steps.bundle.outputs.release_notes }}
          if-no-files-found: error
          retention-days: 7

      - name: Derive Release Metadata
        id: release
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          WORKFLOW_RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_RELEASE_NAME: ${{ inputs.release_name }}
          WORKFLOW_DRAFT_RELEASE: ${{ inputs.draft_release }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(<VERSION)"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_tag="${WORKFLOW_RELEASE_TAG}"
            release_name="${WORKFLOW_RELEASE_NAME}"
            draft_release="${WORKFLOW_DRAFT_RELEASE}"
          else
            version="${version}-$(date -u +%Y%m%d)"
            release_tag="${version}-asterinas"
            release_name="Asterinas Kata ${version}"
            draft_release="false"
          fi

          echo "tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "name=${release_name}" >> "${GITHUB_OUTPUT}"
          echo "draft=${draft_release}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          DRAFT_RELEASE: ${{ steps.release.outputs.draft }}
          RELEASE_ASSET: ${{ steps.bundle.outputs.release_asset }}
          MANIFEST_FILE: ${{ steps.bundle.outputs.manifest_file }}
          CHECKSUMS_FILE: ${{ steps.bundle.outputs.checksums_file }}
          BUILD_SUMMARY: ${{ steps.bundle.outputs.build_summary }}
          RELEASE_NOTES: ${{ steps.bundle.outputs.release_notes }}
        shell: bash
        run: |
          set -euo pipefail

          title="${RELEASE_NAME:-${RELEASE_TAG}}"
          asset_args=(
            "${RELEASE_ASSET}"
            "${MANIFEST_FILE}"
            "${CHECKSUMS_FILE}"
            "${BUILD_SUMMARY}"
          )

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] && gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; skipping publish for duplicate push build."
            exit 0
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            edit_draft_flag=(--draft=false)
            if [[ "${DRAFT_RELEASE}" == "true" ]]; then
              edit_draft_flag=(--draft)
            fi

            gh release edit "${RELEASE_TAG}" \
              --title "${title}" \
              --notes-file "${RELEASE_NOTES}" \
              --target "${GITHUB_SHA}" \
              "${edit_draft_flag[@]}"
            gh release upload "${RELEASE_TAG}" "${asset_args[@]}" --clobber
          else
            draft_flag=()
            if [[ "${DRAFT_RELEASE}" == "true" ]]; then
              draft_flag+=(--draft)
            fi

            gh release create "${RELEASE_TAG}" \
              "${asset_args[@]}" \
              --title "${title}" \
              --notes-file "${RELEASE_NOTES}" \
              --target "${GITHUB_SHA}" \
              "${draft_flag[@]}"
          fi
