name: Test | Asterinas Kata

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - asterinas

permissions:
  contents: read

env:
  KATA_CGROUP_NAMESPACE: host
  KATA_STATIC_TARBALL_RELEASE_REPO: ${{ github.repository }}

jobs:
  resolve-upstream-asterinas-image:
    name: Resolve upstream Asterinas image
    runs-on: ubuntu-latest
    outputs:
      asterinas_version: ${{ steps.resolve.outputs.asterinas_version }}
      docker_image_version: ${{ steps.resolve.outputs.docker_image_version }}
      base_image: ${{ steps.resolve.outputs.base_image }}
    steps:
      - name: Resolve Upstream Asterinas Image Metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asterinas_version="$(
            gh api repos/asterinas/asterinas/contents/VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          docker_image_version="$(
            gh api repos/asterinas/asterinas/contents/DOCKER_IMAGE_VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          test -n "${asterinas_version}"
          test -n "${docker_image_version}"

          echo "asterinas_version=${asterinas_version}" >> "${GITHUB_OUTPUT}"
          echo "docker_image_version=${docker_image_version}" >> "${GITHUB_OUTPUT}"
          echo "base_image=asterinas/asterinas:${docker_image_version}" >> "${GITHUB_OUTPUT}"

          {
            echo '## Resolved upstream Asterinas image'
            echo
            echo "- \`VERSION\`: \`${asterinas_version}\`"
            echo "- \`DOCKER_IMAGE_VERSION\`: \`${docker_image_version}\`"
            echo "- Base image: \`asterinas/asterinas:${docker_image_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  test-kata:
    name: Test Kata (${{ matrix.image_variant }}, ${{ matrix.guest_kernel }})
    needs:
      - resolve-upstream-asterinas-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - source
          - published
        guest_kernel:
          - linux
          - asterinas
    container:
      image: ${{ matrix.image_variant == 'source' && needs.resolve-upstream-asterinas-image.outputs.base_image || format('asterinas/kata:{0}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version) }}
      options: &kata_container_options >-
        --privileged
        --cgroupns host
        --tmpfs /tmp:exec,mode=1777,size=8g
        --tmpfs /var/lib/containerd:exec,mode=755,size=8g
    env:
      KATA_GUEST_KERNEL: ${{ matrix.guest_kernel }}
      KATA_TEST_IMAGE_LOG_LABEL: ${{ matrix.image_variant == 'source' && 'base image / guest kernel' || 'test image / guest kernel' }}
      KATA_TEST_IMAGE_LOG_VALUE: ${{ matrix.image_variant == 'source' && format('{0} / {1}', needs.resolve-upstream-asterinas-image.outputs.base_image, matrix.guest_kernel) || format('asterinas/kata:{0} / {1}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version, matrix.guest_kernel) }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - &checkout_repo
        uses: actions/checkout@v4

      - &check_disk_space
        name: Check Disk Space
        run: |
          set -euxo pipefail
          df -h
          findmnt -no TARGET,FSTYPE,OPTIONS /tmp
          findmnt -no TARGET,FSTYPE,OPTIONS /var/lib/containerd
          stat -f -c '%T %n' /tmp /var/lib/containerd
          printf '%s: %s\n' "${KATA_TEST_IMAGE_LOG_LABEL}" "${KATA_TEST_IMAGE_LOG_VALUE}"

      - &check_overlayfs
        name: Check OverlayFS Staging Prerequisites
        run: |
          set -euxo pipefail
          bash tools/kata/check_overlayfs.sh

      - &install_kata_environment
        name: Install Kata Environment
        run: |
          set -euxo pipefail
          bash tools/kata/kata_env.sh install

      - &run_kata_pass_1
        name: Run Kata Pass 1
        run: |
          set -euxo pipefail
          bash tools/kata/run_kata.sh pass

      - &run_kata_pass_2
        name: Run Kata Pass 2
        run: |
          set -euxo pipefail
          bash tools/kata/run_kata.sh pass
