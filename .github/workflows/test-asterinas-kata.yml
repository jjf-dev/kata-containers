name: Test | Asterinas Kata

on:
  workflow_dispatch:
  push:
    branches:
      - asterinas

permissions:
  contents: read

env:
  KATA_CGROUP_NAMESPACE: host
  KATA_STATIC_TARBALL_RELEASE_REPO: ${{ github.repository }}

jobs:
  resolve-upstream-asterinas-image:
    name: Resolve upstream Asterinas image
    runs-on: ubuntu-latest
    outputs:
      asterinas_version: ${{ steps.resolve.outputs.asterinas_version }}
      docker_image_version: ${{ steps.resolve.outputs.docker_image_version }}
    steps:
      - name: Resolve Upstream Asterinas Image Metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asterinas_version="$(
            gh api repos/asterinas/asterinas/contents/VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          docker_image_version="$(
            gh api repos/asterinas/asterinas/contents/DOCKER_IMAGE_VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          test -n "${asterinas_version}"
          test -n "${docker_image_version}"

          echo "asterinas_version=${asterinas_version}" >> "${GITHUB_OUTPUT}"
          echo "docker_image_version=${docker_image_version}" >> "${GITHUB_OUTPUT}"
          {
            echo '## Resolved upstream Asterinas image'
            echo
            echo "- \`VERSION\`: \`${asterinas_version}\`"
            echo "- \`DOCKER_IMAGE_VERSION\`: \`${docker_image_version}\`"
            echo "- Base image: \`asterinas/asterinas:${docker_image_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  build-published-kata-image:
    name: Build published Asterinas Kata image for tests
    needs:
      - resolve-upstream-asterinas-image
    runs-on: ubuntu-latest
    env:
      ASTERINAS_BASE_IMAGE: asterinas/asterinas:${{ needs.resolve-upstream-asterinas-image.outputs.docker_image_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image for Published-Image Tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/packaging/asterinas-kata/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            asterinas/kata:${{ needs.resolve-upstream-asterinas-image.outputs.docker_image_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Asterinas base image with Kata helpers and Kata environment preinstalled
            org.opencontainers.image.version=${{ needs.resolve-upstream-asterinas-image.outputs.docker_image_version }}
            org.opencontainers.image.base.name=${{ env.ASTERINAS_BASE_IMAGE }}
            io.asterinas.version=${{ needs.resolve-upstream-asterinas-image.outputs.asterinas_version }}
          build-args: |
            ASTERINAS_BASE_IMAGE=${{ env.ASTERINAS_BASE_IMAGE }}
            KATA_STATIC_TARBALL_RELEASE_REPO=${{ github.repository }}
            ASTERINAS_RELEASE_VERSION=${{ needs.resolve-upstream-asterinas-image.outputs.asterinas_version }}
            ASTERINAS_DOCKER_IMAGE_VERSION=${{ needs.resolve-upstream-asterinas-image.outputs.docker_image_version }}

  test-kata:
    name: Test Kata (${{ matrix.image_variant }}, ${{ matrix.guest_kernel }})
    needs:
      - resolve-upstream-asterinas-image
      - build-published-kata-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - source
          - published
        guest_kernel:
          - linux
          - asterinas
    container:
      image: ${{ matrix.image_variant == 'source' && format('asterinas/asterinas:{0}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version) || format('asterinas/kata:{0}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version) }}
      options: &kata_container_options >-
        --privileged
        --device /dev/kvm:/dev/kvm
        --device /dev/vhost-net:/dev/vhost-net
        --device /dev/vsock:/dev/vsock
        --cgroupns host
        --tmpfs /tmp:exec,mode=1777,size=8g
        --tmpfs /var/lib/containerd:exec,mode=755,size=8g
    env:
      KATA_GUEST_KERNEL: ${{ matrix.guest_kernel }}
      KATA_TEST_IMAGE_LOG_LABEL: ${{ matrix.image_variant == 'source' && 'base image / guest kernel' || 'test image / guest kernel' }}
      KATA_TEST_IMAGE_LOG_VALUE: ${{ matrix.image_variant == 'source' && format('asterinas/asterinas:{0} / {1}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version, matrix.guest_kernel) || format('asterinas/kata:{0} / {1}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version, matrix.guest_kernel) }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - &checkout_repo
        uses: actions/checkout@v4

      - &check_disk_space
        name: Check Disk Space
        run: |
          set -euxo pipefail
          df -h
          ls -l /dev/kvm /dev/vhost-net /dev/vhost-vsock /dev/vsock || true
          findmnt -no TARGET,FSTYPE,OPTIONS /tmp
          findmnt -no TARGET,FSTYPE,OPTIONS /var/lib/containerd
          stat -f -c '%T %n' /tmp /var/lib/containerd
          printf '%s: %s\n' "${KATA_TEST_IMAGE_LOG_LABEL}" "${KATA_TEST_IMAGE_LOG_VALUE}"

      - &check_overlayfs
        name: Check OverlayFS Staging Prerequisites
        run: |
          set -euxo pipefail
          bash tools/kata/check_overlayfs.sh

      - &install_kata_environment
        name: Install Kata Environment
        run: |
          set -euxo pipefail
          bash tools/kata/kata_env.sh install

      - &run_kata_pass_1
        name: Run Kata Pass 1
        run: |
          set -euxo pipefail
          bash tools/kata/run_kata.sh pass

      - &run_kata_pass_2
        name: Run Kata Pass 2
        run: |
          set -euxo pipefail
          bash tools/kata/run_kata.sh pass
