name: Compare | Asterinas Kata Vsock Setup

on:
  workflow_dispatch:
  push:
    branches:
      - asterinas

permissions:
  contents: read

env:
  KATA_CGROUP_NAMESPACE: host
  KATA_STATIC_TARBALL_RELEASE_REPO: ${{ github.repository }}

jobs:
  resolve-upstream-asterinas-image:
    name: Resolve upstream Asterinas image
    runs-on: ubuntu-latest
    outputs:
      asterinas_version: ${{ steps.resolve.outputs.asterinas_version }}
      docker_image_version: ${{ steps.resolve.outputs.docker_image_version }}
    steps:
      - name: Resolve Upstream Asterinas Image Metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asterinas_version="$(
            gh api repos/asterinas/asterinas/contents/VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          docker_image_version="$(
            gh api repos/asterinas/asterinas/contents/DOCKER_IMAGE_VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          test -n "${asterinas_version}"
          test -n "${docker_image_version}"

          echo "asterinas_version=${asterinas_version}" >> "${GITHUB_OUTPUT}"
          echo "docker_image_version=${docker_image_version}" >> "${GITHUB_OUTPUT}"

          {
            echo '## Resolved upstream Asterinas image'
            echo
            echo "- \`VERSION\`: \`${asterinas_version}\`"
            echo "- \`DOCKER_IMAGE_VERSION\`: \`${docker_image_version}\`"
            echo "- Source image: \`asterinas/asterinas:${docker_image_version}\`"
            echo "- Published image: \`asterinas/kata:${docker_image_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  compare-vsock-host-setup:
    name: Compare vsock host setup (${{ matrix.image_variant }}, modprobe=${{ matrix.modprobe_vhost_vsock }})
    needs:
      - resolve-upstream-asterinas-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image_variant:
          - source
          - published
        modprobe_vhost_vsock:
          - false
          - true
    env:
      TEST_IMAGE: ${{ matrix.image_variant == 'source' && format('asterinas/asterinas:{0}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version) || format('asterinas/kata:{0}', needs.resolve-upstream-asterinas-image.outputs.docker_image_version) }}
      KATA_GUEST_KERNEL: asterinas
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Host Vsock Environment
        shell: bash
        run: |
          set -euxo pipefail

          if [ "${{ matrix.modprobe_vhost_vsock }}" = "true" ]; then
            sudo modprobe vhost_vsock
          else
            echo "Skipping modprobe vhost_vsock for comparison"
          fi

          lsmod | grep -E '(^vhost_vsock|^vsock|^vhost_net)' || true
          ls -l /dev/kvm /dev/vhost-net /dev/vhost-vsock /dev/vsock || true

      - name: Pull Test Image
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "${TEST_IMAGE}"

      - name: Run Kata Comparison Passes
        shell: bash
        run: |
          set -euxo pipefail

          docker run --rm \
            --privileged \
            --device /dev/kvm:/dev/kvm \
            --device /dev/vhost-net:/dev/vhost-net \
            --device /dev/vhost-vsock:/dev/vhost-vsock \
            --device /dev/vsock:/dev/vsock \
            --cgroupns host \
            --tmpfs /tmp:exec,mode=1777,size=8g \
            --tmpfs /var/lib/containerd:exec,mode=755,size=8g \
            --volume "${GITHUB_WORKSPACE}/tools/kata:/root/asterinas/tools/kata:ro" \
            --env "KATA_CGROUP_NAMESPACE=${KATA_CGROUP_NAMESPACE}" \
            --env "KATA_GUEST_KERNEL=${KATA_GUEST_KERNEL}" \
            --env "KATA_STATIC_TARBALL_RELEASE_REPO=${KATA_STATIC_TARBALL_RELEASE_REPO}" \
            "${TEST_IMAGE}" \
            bash -lc '
              set -euxo pipefail

              cd /root/asterinas
              df -h
              ls -l /dev/kvm /dev/vhost-net /dev/vhost-vsock /dev/vsock || true
              findmnt -no TARGET,FSTYPE,OPTIONS /tmp
              findmnt -no TARGET,FSTYPE,OPTIONS /var/lib/containerd
              stat -f -c "%T %n" /tmp /var/lib/containerd
              printf "test image: %s\n" "'"${TEST_IMAGE}"'"
              printf "guest kernel: %s\n" "'"${KATA_GUEST_KERNEL}"'"
              printf "modprobe_vhost_vsock: %s\n" "'"${{ matrix.modprobe_vhost_vsock }}"'"

              bash tools/kata/check_overlayfs.sh
              bash tools/kata/kata_env.sh install
              bash tools/kata/run_kata.sh pass
              bash tools/kata/run_kata.sh pass
            '
