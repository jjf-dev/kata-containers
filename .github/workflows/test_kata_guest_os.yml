name: Test Kata Guest OS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  resolve-asterinas-image:
    name: Resolve upstream Asterinas image
    runs-on: ubuntu-latest
    outputs:
      asterinas_version: ${{ steps.resolve.outputs.asterinas_version }}
      docker_image_version: ${{ steps.resolve.outputs.docker_image_version }}
      base_image: ${{ steps.resolve.outputs.base_image }}
    steps:
      - name: Resolve upstream Docker image version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          asterinas_version="$(
            gh api repos/asterinas/asterinas/contents/VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          docker_image_version="$(
            gh api repos/asterinas/asterinas/contents/DOCKER_IMAGE_VERSION?ref=main --jq .content |
              base64 -d | tr -d '\n'
          )"
          test -n "${asterinas_version}"
          test -n "${docker_image_version}"

          echo "asterinas_version=${asterinas_version}" >> "${GITHUB_OUTPUT}"
          echo "docker_image_version=${docker_image_version}" >> "${GITHUB_OUTPUT}"
          echo "base_image=asterinas/asterinas:${docker_image_version}" >> "${GITHUB_OUTPUT}"

          {
            echo '## Resolved upstream Asterinas image'
            echo
            echo "- \`VERSION\`: \`${asterinas_version}\`"
            echo "- \`DOCKER_IMAGE_VERSION\`: \`${docker_image_version}\`"
            echo "- Base image: \`asterinas/asterinas:${docker_image_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  prepare-kata-runtime-host:
    needs:
      - resolve-asterinas-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve-asterinas-image.outputs.base_image }}
      options: >-
        --privileged
        --cgroupns host
        --tmpfs /tmp:exec,mode=1777,size=8g
        --tmpfs /var/lib/containerd:exec,mode=755,size=8g
    env:
      KATA_CGROUP_NAMESPACE: host
      KATA_GUEST_KERNEL: linux
      KATA_STATIC_TARBALL_RELEASE_REPO: ${{ github.repository }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - name: Check disk space
        run: |
          set -euxo pipefail
          df -h
          findmnt -no TARGET,FSTYPE,OPTIONS /tmp
          findmnt -no TARGET,FSTYPE,OPTIONS /var/lib/containerd
          stat -f -c '%T %n' /tmp /var/lib/containerd
          printf 'base image: %s\n' "${{ needs.resolve-asterinas-image.outputs.base_image }}"

      - uses: actions/checkout@v4

      - name: Check overlayfs staging prerequisites
        run: |
          set -euxo pipefail
          bash tools/kata/check_overlayfs.sh

      - name: Install Kata environment
        run: |
          set -euxo pipefail
          bash tools/kata/kata_env.sh install

      - name: Run Kata pass 1
        run: |
          set -euxo pipefail
          bash tools/kata/run_kata.sh pass

      - name: Run Kata pass 2
        run: |
          set -euxo pipefail
          bash tools/kata/run_kata.sh pass

  prepare-preinstalled-kata-runtime-host:
    name: Test published Asterinas Kata image
    needs:
      - resolve-asterinas-image
    runs-on: ubuntu-latest
    env:
      KATA_IMAGE: asterinas/asterinas-kata:${{ needs.resolve-asterinas-image.outputs.docker_image_version }}
      KATA_CGROUP_NAMESPACE: host
      KATA_GUEST_KERNEL: linux
    defaults:
      run:
        shell: bash
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Pull Asterinas Kata image
        run: |
          set -euxo pipefail

          docker pull "${KATA_IMAGE}"
          docker image inspect "${KATA_IMAGE}" >/dev/null
          {
            echo '## Pulled published Asterinas Kata image'
            echo
            echo "- Image: \`${KATA_IMAGE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run Kata tests from Asterinas Kata image
        run: |
          set -euxo pipefail

          docker run --rm \
            --privileged \
            --cgroupns host \
            --tmpfs /tmp:exec,mode=1777,size=8g \
            --tmpfs /var/lib/containerd:exec,mode=755,size=8g \
            --volume "${GITHUB_WORKSPACE}/tools/kata:/root/asterinas/tools/kata:ro" \
            --env "KATA_CGROUP_NAMESPACE=${KATA_CGROUP_NAMESPACE}" \
            --env "KATA_GUEST_KERNEL=${KATA_GUEST_KERNEL}" \
            "${KATA_IMAGE}" \
            bash -lc '
              set -euxo pipefail

              cd /root/asterinas
              df -h
              findmnt -no TARGET,FSTYPE,OPTIONS /tmp
              findmnt -no TARGET,FSTYPE,OPTIONS /var/lib/containerd
              stat -f -c "%T %n" /tmp /var/lib/containerd
              printf "test image: %s\n" "'"${KATA_IMAGE}"'"

              bash tools/kata/check_overlayfs.sh
              bash tools/kata/run_kata.sh pass
              bash tools/kata/run_kata.sh pass
            '
